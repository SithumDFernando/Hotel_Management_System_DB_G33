name: SkyNest CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  database-and-backend:
    name: Database Schema & Backend Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: skynest_user
          POSTGRES_PASSWORD: skynest_dev_pass
          POSTGRES_DB: skynest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Build Database Schema & Load Seed Data
        env:
          PGPASSWORD: skynest_dev_pass
        run: |
          cd db
          psql -h localhost -U skynest_user -d skynest -f run_all.sql

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify FastAPI App Initialization
        env:
          DATABASE_URL: postgresql://skynest_user:skynest_dev_pass@localhost:5432/skynest
          SECRET_KEY: testsecretkeyformodulartestingpurposeonly12345
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 1440
          FRONTEND_ORIGIN: http://localhost:5173
          PYTHONPATH: backend
        run: |
          python -c "from app.main import app; print('[CI] FastAPI app loaded successfully!')"

      - name: Run Database Smoke Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://skynest_user:skynest_dev_pass@localhost:5432/skynest
          SECRET_KEY: testsecretkeyformodulartestingpurposeonly12345
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 1440
          FRONTEND_ORIGIN: http://localhost:5173
        run: |
          python tests/test_db_crud.py

  frontend:
    name: Frontend Build & Type Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Production Build
        working-directory: frontend
        run: npm run build
